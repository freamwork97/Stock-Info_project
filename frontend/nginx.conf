server {
    listen 80;

    # React SPA 정적 파일 서빙
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # FastAPI 백엔드 API 프록시
    # package.json의 proxy 설정(localhost:8000)을 대체
    location ~ ^/(stock|news|exchange_rate|financial_statements|get_stock_price|company_names|key_index|post|posts|predict_stock) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
